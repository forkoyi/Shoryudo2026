<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>🗾 北陸旅遊 2026</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Nunito:wght@700;800;900&display=swap');
:root{
  --bg:#f7f3ee;
  --surface:#ffffff;
  --surface2:#fdf6ee;
  --border:#e8ddd0;
  --border2:#f0e6d8;
  --accent:#f27c35;
  --accent2:#e8445a;
  --accent3:#3aadcf;
  --accent4:#4cb87a;
  --text:#2d2318;
  --text2:#7a6555;
  --text3:#b8a898;
  --r:14px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;}
body{
  font-family:'Noto Sans TC',sans-serif;
  background:var(--bg);color:var(--text);
  max-width:430px;margin:0 auto;
  display:flex;flex-direction:column;height:100%;
}

/* ── App Header (hidden on itinerary tab, hero takes over) ── */
.app-header{
  background:linear-gradient(135deg,#ff8c42,#f05a78);
  padding:14px 16px 12px;flex-shrink:0;
  display:flex;align-items:center;justify-content:space-between;
  box-shadow:0 2px 12px rgba(240,90,120,.25);
}
.app-title{font-family:'Nunito',sans-serif;font-size:19px;font-weight:900;color:#fff;}
.app-sub{font-size:10px;color:rgba(255,255,255,.8);margin-top:1px;}
.app-badge{background:rgba(255,255,255,.22);border:1px solid rgba(255,255,255,.4);
  color:#fff;font-size:10px;font-weight:700;padding:3px 10px;border-radius:20px;}

/* ── Pages ── */
.pages{flex:1;overflow:hidden;position:relative;}
.page{position:absolute;inset:0;overflow-y:auto;display:none;}
.page.active{display:block;}
#page-itinerary{display:none;flex-direction:column;overflow:hidden;}
#page-itinerary.active{display:flex;}

/* ── Bottom Nav ── */
.tab-nav{
  display:flex;background:#fff;
  border-top:1.5px solid var(--border2);flex-shrink:0;
  padding:6px 0 calc(6px + env(safe-area-inset-bottom));
  box-shadow:0 -3px 14px rgba(0,0,0,.07);
}
.tab-btn{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;
  padding:4px 4px;cursor:pointer;border:none;background:none;
  color:var(--text3);font-size:10px;font-family:'Noto Sans TC',sans-serif;
  transition:all .2s;
}
.tab-btn .ico{font-size:21px;transition:transform .2s;}
.tab-btn.active{color:var(--accent);}
.tab-btn.active .ico{transform:scale(1.15);}

/* ════════════════════════════════
   PAGE 1: 行程
   ════════════════════════════════ */

/* Hero Banner */
.it-hero{
  flex-shrink:0;
  background:linear-gradient(155deg,#ff7043 0%,#f5453d 35%,#e91e8c 100%);
  padding:20px 18px 0;position:relative;overflow:hidden;
}
.it-hero::before{
  content:'✈️';font-size:120px;opacity:.08;
  position:absolute;right:-16px;top:-10px;
  pointer-events:none;line-height:1;
}
.it-hero-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:16px;}
.it-hero-left{}
.it-hero-eyebrow{
  font-size:10px;font-weight:700;letter-spacing:.12em;
  color:rgba(255,255,255,.7);text-transform:uppercase;margin-bottom:6px;
}
.it-hero-title{
  font-family:'Nunito',sans-serif;font-size:28px;font-weight:900;
  color:#fff;line-height:1.1;text-shadow:0 2px 10px rgba(0,0,0,.15);
  transition:opacity .2s;
}
.it-hero-sub{font-size:12px;color:rgba(255,255,255,.75);margin-top:5px;font-weight:500;}

/* Weather pill top-right */
.it-wx-pill{
  background:rgba(255,255,255,.18);backdrop-filter:blur(10px);
  border:1.5px solid rgba(255,255,255,.3);border-radius:18px;
  padding:12px 14px;text-align:center;min-width:72px;flex-shrink:0;
  cursor:pointer;transition:background .15s;
}
.it-wx-pill:hover{background:rgba(255,255,255,.25);}
.it-wx-icon{font-size:26px;line-height:1;}
.it-wx-temp{
  font-family:'Nunito',sans-serif;font-size:20px;font-weight:900;
  color:#fff;line-height:1;margin-top:3px;
}
.it-wx-city{font-size:9px;color:rgba(255,255,255,.7);margin-top:2px;}
.it-wx-loading{font-size:10px;color:rgba(255,255,255,.6);padding:8px 0;}

/* Day selector strip */
.it-day-strip{
  display:flex;gap:8px;overflow-x:auto;
  padding:0 18px 18px;
  scrollbar-width:none;
}
.it-day-strip::-webkit-scrollbar{display:none;}
.it-day-pill{
  flex-shrink:0;cursor:pointer;
  background:rgba(255,255,255,.16);backdrop-filter:blur(6px);
  border:1.5px solid rgba(255,255,255,.22);border-radius:14px;
  padding:9px 14px;text-align:center;min-width:58px;
  transition:all .22s cubic-bezier(.4,0,.2,1);
}
.it-day-pill.active{
  background:#fff;border-color:#fff;
  box-shadow:0 5px 18px rgba(0,0,0,.18);
  transform:translateY(-3px);
}
.it-day-pill .dp-label{font-size:9px;color:rgba(255,255,255,.65);font-weight:700;letter-spacing:.06em;}
.it-day-pill.active .dp-label{color:var(--accent);}
.it-day-pill .dp-num{
  font-family:'Nunito',sans-serif;font-size:22px;font-weight:900;
  color:#fff;line-height:1;
}
.it-day-pill.active .dp-num{color:var(--accent);}
.it-day-pill .dp-date{font-size:8.5px;color:rgba(255,255,255,.6);margin-top:1px;}
.it-day-pill.active .dp-date{color:var(--text2);}

/* Day content scroll area */
.it-body{
  flex:1;overflow-y:auto;background:var(--bg);
  -webkit-overflow-scrolling:touch;
}

/* Day content panel */
.it-panel{padding:0 0 32px;}

/* Day subheader inside scroll area */
.it-day-subhead{
  display:flex;align-items:center;justify-content:space-between;
  padding:16px 18px 10px;
}
.it-day-subhead-left{display:flex;align-items:center;gap:10px;}
.it-day-color-bar{width:5px;height:44px;border-radius:3px;flex-shrink:0;}
.it-day-name{
  font-family:'Nunito',sans-serif;font-size:20px;font-weight:900;
  color:var(--text);line-height:1.15;
}
.it-day-datestr{font-size:11px;color:var(--text2);margin-top:1px;}

/* Inline weather compact (right side of subhead) */
.it-wx-inline{
  background:linear-gradient(135deg,#e0f5ff,#d0eef8);
  border:1.5px solid #a8d8f0;border-radius:12px;
  padding:8px 12px;display:flex;align-items:center;gap:6px;
  cursor:pointer;text-decoration:none;flex-shrink:0;transition:all .15s;
}
.it-wx-inline:hover{background:linear-gradient(135deg,#cceeff,#bce4f4);}
.it-wx-inline .wxi-icon{font-size:18px;}
.it-wx-inline .wxi-temp{
  font-family:'Nunito',sans-serif;font-size:15px;font-weight:800;color:#1a6090;
}
.it-wx-inline .wxi-desc{font-size:9px;color:#4a8db0;margin-top:1px;}

/* Transport */
.it-transport{
  margin:0 16px 12px;
  background:linear-gradient(135deg,#fffaf2,#fff4e4);
  border:1.5px solid #ffd9a8;border-radius:14px;
  padding:11px 14px;font-size:12.5px;color:#7a4a10;line-height:1.7;
}

/* Section label */
.it-sec{
  font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;
  color:var(--text3);padding:12px 18px 8px;
  display:flex;align-items:center;gap:8px;
}
.it-sec::after{content:'';flex:1;height:1.5px;background:var(--border2);border-radius:1px;}

/* Stop cards — timeline */
.it-stops{padding:0 16px;position:relative;}
.it-stops::before{
  content:'';position:absolute;
  left:32px;top:14px;bottom:14px;
  width:2px;background:linear-gradient(180deg,var(--border2) 0%,transparent 100%);
}
.it-stop{
  display:flex;gap:12px;margin-bottom:10px;align-items:flex-start;
}
.it-stop-dot{
  width:34px;height:34px;border-radius:50%;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-size:16px;
  border:3px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.13);
  position:relative;z-index:1;margin-top:2px;
}
.it-stop-card{
  flex:1;background:#fff;border:1.5px solid var(--border2);border-radius:14px;
  padding:12px 13px;
  box-shadow:0 2px 10px rgba(0,0,0,.05);
  transition:transform .15s,box-shadow .15s;
}
.it-stop-card:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(0,0,0,.1);}
.it-stop-name{font-size:13.5px;font-weight:700;color:var(--text);line-height:1.25;}
.it-stop-addr{font-size:10.5px;color:var(--text3);margin-top:3px;line-height:1.4;}
.it-stop-chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px;align-items:center;}
.chip{font-size:10px;padding:3px 8px;border-radius:6px;font-family:'Courier New',monospace;font-weight:600;}
.chip-map{background:#dbeeff;color:#1a5ca0;}
.chip-tel{background:#d5f5e2;color:#176a3a;}
.chip-note{background:#fff3d0;color:#8a4e00;}
.map-btn{
  display:inline-flex;align-items:center;gap:5px;
  background:linear-gradient(135deg,#2ecc71,#27ae60);color:#fff;
  border:none;border-radius:8px;padding:5px 12px;font-size:11px;font-weight:700;
  text-decoration:none;box-shadow:0 2px 8px rgba(39,174,96,.28);transition:all .15s;
}
.map-btn:active{transform:scale(.97);}

/* Page fade animation */
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}

/* ════════════════════════════════
   PAGE 2: 行前確認
   ════════════════════════════════ */
.cl-wrap{padding:14px 16px 24px;}
.cl-progress{
  background:linear-gradient(135deg,#fff8ee,#ffeedd);
  border:1.5px solid #ffd09a;border-radius:var(--r);
  padding:14px;margin-bottom:14px;
  box-shadow:0 2px 8px rgba(242,124,53,.1);
}
.cl-prog-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
.cl-prog-label{font-size:12px;font-weight:700;color:var(--accent);}
.cl-prog-txt{font-size:12px;color:var(--text2);}
.cl-prog-track{height:8px;background:#ffe0b8;border-radius:4px;}
.cl-prog-fill{height:100%;background:linear-gradient(90deg,#f27c35,#f5a623);border-radius:4px;transition:width .4s;}

.cl-add-trigger{
  display:flex;align-items:center;justify-content:center;gap:8px;
  background:#fff;border:2px dashed var(--border);border-radius:var(--r);
  padding:13px;color:var(--text2);font-size:13px;cursor:pointer;
  transition:all .2s;margin-bottom:14px;font-weight:500;
}
.cl-add-trigger:hover{border-color:var(--accent);color:var(--accent);background:#fff9f4;}

.cl-add-form{
  background:linear-gradient(135deg,#fff8ee,#fff0f5);
  border:2px solid var(--accent);border-radius:var(--r);
  padding:14px;margin-bottom:14px;display:none;
  box-shadow:0 4px 16px rgba(242,124,53,.15);
  animation:fadeUp .2s ease;
}
.cl-add-form.open{display:block;}
.cl-form-row{display:flex;gap:8px;margin-bottom:8px;}
.cl-form-input{
  flex:1;background:#fff;border:1.5px solid var(--border2);border-radius:9px;
  padding:10px 12px;color:var(--text);font-size:13px;
  font-family:'Noto Sans TC',sans-serif;outline:none;transition:border-color .2s;
}
.cl-form-input:focus{border-color:var(--accent);}
.cl-form-input::placeholder{color:var(--text3);}
.cl-form-select{
  background:#fff;border:1.5px solid var(--border2);border-radius:9px;
  padding:10px 10px;color:var(--text);font-size:12px;
  font-family:'Noto Sans TC',sans-serif;outline:none;cursor:pointer;
}
.cl-form-btns{display:flex;justify-content:flex-end;gap:8px;}
.cl-btn{
  padding:9px 16px;border:none;border-radius:9px;font-size:13px;font-weight:700;
  cursor:pointer;font-family:'Noto Sans TC',sans-serif;transition:all .15s;
}
.cl-btn-ok{background:linear-gradient(135deg,#f27c35,#f5a623);color:#fff;box-shadow:0 2px 8px rgba(242,124,53,.3);}
.cl-btn-ok:hover{transform:scale(1.03);}
.cl-btn-cancel{background:#fff;border:1.5px solid var(--border2);color:var(--text2);}
.cl-btn-cancel:hover{background:#f8f0e8;}

.cl-group{margin-bottom:14px;}
.cl-group-title{
  font-size:12px;font-weight:800;color:var(--accent);
  font-family:'Nunito',sans-serif;margin-bottom:8px;letter-spacing:.02em;
}
.cl-item{
  display:flex;align-items:flex-start;gap:10px;padding:10px 12px;
  background:#fff;border:1.5px solid var(--border2);border-radius:10px;
  margin-bottom:5px;cursor:pointer;transition:all .15s;
  box-shadow:0 1px 4px rgba(0,0,0,.04);
}
.cl-item:hover{background:#fffaf3;border-color:#ffc870;transform:translateX(2px);}
.cl-item.done{opacity:.45;}
.cl-checkbox{
  width:20px;height:20px;border-radius:6px;border:2px solid var(--border);
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;font-size:12px;transition:all .18s;
}
.cl-item.done .cl-checkbox{background:var(--accent4);border-color:var(--accent4);color:#fff;}
.cl-text{flex:1;}
.cl-main{font-size:13px;color:var(--text);}
.cl-sub{font-size:11px;color:var(--text2);margin-top:2px;line-height:1.4;}
.cl-del{background:none;border:none;color:var(--text3);cursor:pointer;font-size:16px;padding:0 2px;transition:color .15s;flex-shrink:0;}
.cl-del:hover{color:var(--accent2);}

/* ════════════════════════════════
   PAGE 3: 待買清單
   ════════════════════════════════ */
.sh-wrap{padding:14px 16px 24px;}
.sh-add-area{margin-bottom:12px;}
.sh-row1{display:flex;gap:8px;margin-bottom:8px;align-items:center;}
.sh-row2{display:flex;gap:8px;align-items:center;}
.sh-input{
  flex:1;min-width:0;
  background:#fff;border:1.5px solid var(--border2);border-radius:10px;
  padding:10px 12px;color:var(--text);font-size:13px;
  font-family:'Noto Sans TC',sans-serif;outline:none;transition:border-color .2s;
  width:100%;
}
.sh-input:focus{border-color:var(--accent);}
.sh-input::placeholder{color:var(--text3);}
.sh-cat-sel{
  flex:1;min-width:0;
  background:#fff;border:1.5px solid var(--border2);border-radius:10px;
  padding:10px;color:var(--text);font-size:12px;
  font-family:'Noto Sans TC',sans-serif;outline:none;cursor:pointer;
}
.sh-add-btn{
  flex-shrink:0;
  background:linear-gradient(135deg,#f27c35,#f5a623);color:#fff;
  border:none;border-radius:10px;padding:10px 18px;font-size:16px;font-weight:900;
  cursor:pointer;box-shadow:0 2px 8px rgba(242,124,53,.3);transition:all .15s;
}
.sh-add-btn:hover{transform:scale(1.06);}
.sh-cat-section{margin-bottom:14px;}
.sh-cat-label{
  font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.07em;
  margin-bottom:7px;padding-left:2px;font-family:'Nunito',sans-serif;
}
.sh-item{
  background:#fff;border:1.5px solid var(--border2);border-radius:12px;
  margin-bottom:8px;overflow:hidden;
  box-shadow:0 2px 8px rgba(0,0,0,.04);
}
.sh-item-row{display:flex;align-items:center;gap:10px;padding:11px 13px;}
.sh-check{
  width:20px;height:20px;border-radius:50%;border:2px solid var(--border);
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  flex-shrink:0;transition:all .15s;font-size:12px;
}
.sh-item.bought .sh-check{background:var(--accent3);border-color:var(--accent3);color:#fff;}
.sh-item.bought .sh-name{opacity:.4;text-decoration:line-through;}
.sh-name{font-size:13px;color:var(--text);flex:1;}
.sh-del{background:none;border:none;color:var(--text3);cursor:pointer;font-size:15px;padding:2px 4px;transition:color .15s;}
.sh-del:hover{color:var(--accent2);}
.sh-photos{display:flex;flex-wrap:wrap;gap:6px;padding:0 13px 11px;}
.sh-photo{
  width:70px;height:70px;border-radius:10px;object-fit:cover;cursor:pointer;
  border:1.5px solid var(--border2);transition:transform .15s;
  box-shadow:0 2px 6px rgba(0,0,0,.08);
}
.sh-photo:hover{transform:scale(1.08);}
.sh-photo-add{
  width:70px;height:70px;border-radius:10px;border:2px dashed var(--border);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  cursor:pointer;color:var(--text3);font-size:10px;gap:3px;
  background:var(--surface2);transition:all .15s;
}
.sh-photo-add:hover{border-color:var(--accent);color:var(--accent);}
.sh-photo-add .ph-plus{font-size:22px;}
.ph-input{display:none;}

/* Lightbox */
.lightbox{
  position:fixed;inset:0;background:rgba(30,20,10,.9);
  display:none;align-items:center;justify-content:center;z-index:999;padding:20px;
}
.lightbox.open{display:flex;}
.lightbox img{max-width:100%;max-height:100%;border-radius:14px;object-fit:contain;box-shadow:0 10px 40px rgba(0,0,0,.4);}
.lb-close{
  position:absolute;top:16px;right:16px;
  background:rgba(255,255,255,.15);backdrop-filter:blur(8px);
  border:1px solid rgba(255,255,255,.3);border-radius:50%;
  width:40px;height:40px;display:flex;align-items:center;justify-content:center;
  cursor:pointer;color:#fff;font-size:20px;
}

/* ════════════════════════════════
   PAGE 4: 工具
   ════════════════════════════════ */
.tl-wrap{padding:14px 16px 24px;}
.tl-card{
  background:#fff;border:1.5px solid var(--border2);border-radius:var(--r);
  padding:18px;margin-bottom:14px;
  box-shadow:0 2px 12px rgba(0,0,0,.05);
}
.tl-title{
  font-size:14px;font-weight:900;color:var(--accent);margin-bottom:14px;
  display:flex;align-items:center;gap:6px;font-family:'Nunito',sans-serif;
}

/* Exchange */
.ex-tabs{display:flex;gap:7px;margin-bottom:12px;}
.ex-tab{
  flex:1;padding:8px;text-align:center;
  background:var(--surface2);border:1.5px solid var(--border2);border-radius:9px;
  font-size:11px;cursor:pointer;font-weight:700;color:var(--text2);transition:all .15s;
}
.ex-tab.active{background:linear-gradient(135deg,#f27c35,#f5a623);color:#fff;border-color:#f27c35;box-shadow:0 2px 8px rgba(242,124,53,.3);}
.ex-lbl{font-size:10px;color:var(--text3);margin-bottom:5px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;}
.ex-inp{
  width:100%;background:var(--surface2);border:1.5px solid var(--border2);border-radius:10px;
  padding:12px 14px;color:var(--text);font-size:20px;font-weight:800;
  font-family:'Noto Sans TC',sans-serif;outline:none;transition:border-color .2s;margin-bottom:10px;
}
.ex-inp:focus{border-color:var(--accent);}
.ex-result{
  background:linear-gradient(135deg,#fff5e6,#ffeedd);border:1.5px solid #ffd0a0;
  border-radius:12px;padding:16px;text-align:center;margin-bottom:10px;
}
.ex-result-num{font-family:'Nunito',sans-serif;font-size:30px;font-weight:900;color:var(--accent);}
.ex-result-sub{font-size:11px;color:var(--text2);margin-top:4px;}
.ex-rate-badge{
  background:#e4f4fc;border:1.5px solid #a8d8ee;border-radius:9px;
  padding:8px 12px;font-size:11px;color:#1a7aaa;text-align:center;
}
.ex-rate-live{color:var(--accent3);font-weight:700;}

/* Ledger */
.ld-add{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px;}
.ld-inp{
  background:var(--surface2);border:1.5px solid var(--border2);border-radius:9px;
  padding:9px 10px;color:var(--text);font-size:12px;
  font-family:'Noto Sans TC',sans-serif;outline:none;transition:border-color .2s;width:100%;
}
.ld-inp:focus{border-color:var(--accent3);}
.ld-inp::placeholder{color:var(--text3);}
.ld-inp-full{grid-column:span 2;}
.ld-sel{
  background:var(--surface2);border:1.5px solid var(--border2);border-radius:9px;
  padding:9px 10px;color:var(--text);font-size:12px;
  font-family:'Noto Sans TC',sans-serif;outline:none;cursor:pointer;width:100%;
}
.ld-add-btn{
  grid-column:span 2;background:linear-gradient(135deg,#3aadcf,#22a0c5);
  color:#fff;border:none;border-radius:9px;padding:11px;
  font-size:13px;font-weight:700;cursor:pointer;
  font-family:'Noto Sans TC',sans-serif;
  box-shadow:0 2px 8px rgba(58,173,207,.3);transition:all .15s;
}
.ld-add-btn:hover{transform:scale(1.02);}
.ld-row{

let currentDay = 0;

// ══════════════ ITINERARY ══════════════
function buildDayStrip() {
  document.getElementById('day-strip').innerHTML = DAYS.map((d,i)=>`
    <div class="it-day-pill ${i===0?'active':''}" id="pill-${i}" onclick="gotoDay(${i})">
      <div class="dp-label">Day</div>
      <div class="dp-num">${d.n}</div>
      <div class="dp-date">${d.date.split(' ')[0]}</div>
    </div>`).join('');
}

function gotoDay(idx) {
  if (idx < 0 || idx >= DAYS.length) return;
  currentDay = idx;
  const d = DAYS[idx];
  wxUrlCurrent = d.wx.url;

  // Update pills
  document.querySelectorAll('.it-day-pill').forEach((el,i)=>el.classList.toggle('active',i===idx));
  const pill = document.getElementById('pill-'+idx);
  if (pill) pill.scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'});

  // Update hero text
  document.getElementById('hero-title').textContent = d.title;
  document.getElementById('hero-sub').textContent = `Day ${d.n} · ${d.date}`;

  // Animate content out → render → animate in
  const panel = document.getElementById('it-panel');
  panel.style.transition = 'opacity .15s ease, transform .15s ease';
  panel.style.opacity = '0';
  panel.style.transform = 'translateY(10px)';

  setTimeout(()=>{
    renderDayPanel(idx);
    panel.style.transition = 'opacity .28s ease, transform .28s ease';
    panel.style.opacity = '1';
    panel.style.transform = 'translateY(0)';
    document.getElementById('it-body').scrollTop = 0;
    if (wxCache[idx]) applyWxInline(idx, wxCache[idx]);
  }, 160);

  fetchWx(idx);
}

function renderDayPanel(idx) {
  const d = DAYS[idx];
  const stopsHtml = d.stops.map(s=>{
    const mc  = s.mapcode ? `<span class="chip chip-map">MAP ${s.mapcode}</span>` : '';
    const tel = s.tel ? `<span class="chip chip-tel">☎ ${s.tel}</span>` : '';
    const note= s.note ? `<span class="chip chip-note">${s.note}</span>` : '';
    const nav = `https://www.google.com/maps/dir/?api=1&destination=${s.lat},${s.lng}`;
    return `<div class="it-stop">
      <div class="it-stop-dot" style="background:${d.color}">${s.emoji||'📍'}</div>
      <div class="it-stop-card">
        <div class="it-stop-name">${s.name}</div>
        <div class="it-stop-addr">${s.addr}</div>
        <div class="it-stop-chips">
          <a class="map-btn" href="${nav}" target="_blank">📍 Google導航</a>
          ${mc}${tel}${note}
        </div>
      </div>
    </div>`;
  }).join('');

  document.getElementById('it-panel').innerHTML = `
    <div class="it-day-subhead">
      <div class="it-day-subhead-left">
        <div class="it-day-color-bar" style="background:${d.color}"></div>
        <div>
          <div class="it-day-name">${d.emoji} ${d.title}</div>
          <div class="it-day-datestr">${d.date}</div>
        </div>
      </div>
      <a class="it-wx-inline" href="${d.wx.url}" target="_blank" id="wx-inline">
        <span class="wxi-icon" id="wxi-icon">🌤</span>
        <div>
          <div class="wxi-temp" id="wxi-temp">—</div>
          <div class="wxi-desc" id="wxi-desc">天氣預報</div>
        </div>
      </a>
    </div>
    <div class="it-sec">🚗 今日交通</div>
    <div class="it-transport">${d.transport}</div>
    <div class="it-sec">📍 今日地點</div>
    <div class="it-stops">${stopsHtml}</div>
    <div style="height:20px"></div>`;
}

// ══════════════ WEATHER ══════════════
const WX = {
  0:{i:'☀️',d:'晴天'},1:{i:'🌤️',d:'多雲時晴'},2:{i:'⛅',d:'多雲'},3:{i:'☁️',d:'陰天'},
  45:{i:'🌫️',d:'霧'},48:{i:'🌫️',d:'霧'},51:{i:'🌦️',d:'毛毛雨'},53:{i:'🌧️',d:'小雨'},
  55:{i:'🌧️',d:'中雨'},61:{i:'🌧️',d:'小雨'},63:{i:'🌧️',d:'中雨'},65:{i:'🌧️',d:'大雨'},
  71:{i:'❄️',d:'小雪'},80:{i:'🌦️',d:'陣雨'},95:{i:'⛈️',d:'雷雨'},
};
function getWx(c){return WX[c]||WX[Math.floor(c/10)*10]||{i:'🌡️',d:'—'};}

async function fetchWx(idx) {
  if (wxCache[idx]) { applyWxBanner(wxCache[idx]); applyWxInline(idx,wxCache[idx]); return; }
  const d = DAYS[idx];
  try {
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${d.wx.lat}&longitude=${d.wx.lon}&daily=temperature_2m_max,temperature_2m_min,weathercode&timezone=Asia%2FTokyo&forecast_days=16`;
    const r = await fetch(url);
    const data = await r.json();
    const target = new Date(2026,4,23+idx).toISOString().split('T')[0];
    const di = data.daily.time.indexOf(target);
    if (di===-1) throw 0;
    const info = {max:Math.round(data.daily.temperature_2m_max[di]),min:Math.round(data.daily.temperature_2m_min[di]),code:data.daily.weathercode[di],city:d.wx.city};
    wxCache[idx] = info;
    applyWxBanner(info);
    applyWxInline(idx, info);
  } catch(e) {
    document.getElementById('hero-wx').innerHTML = `<div style="font-size:9px;color:rgba(255,255,255,.6);padding:6px 0;">無法取得<br>天氣</div>`;
  }
}

function applyWxBanner(info) {
  const w = getWx(info.code);
  document.getElementById('hero-wx').innerHTML = `
    <div class="it-wx-icon">${w.i}</div>
    <div class="it-wx-temp">${info.max}°</div>
    <div class="it-wx-city">${info.city}</div>`;
}
function applyWxInline(idx, info) {
  const w = getWx(info.code);
  const icon = document.getElementById('wxi-icon');
  const temp = document.getElementById('wxi-temp');
  const desc = document.getElementById('wxi-desc');
  if (icon) icon.textContent = w.i;
  if (temp) temp.textContent = `${info.max}°/${info.min}°`;
  if (desc) desc.textContent = w.d;
}
function openWxLink(){ window.open(wxUrlCurrent,'_blank'); }

// ══════════════ CHECKLIST ══════════════
function buildChecklist() {
  const c = document.getElementById('cl-container');
  c.innerHTML = '';
  checklist.forEach((g,gi)=>{
    const div = document.createElement('div');
    div.className = 'cl-group';
    div.innerHTML = `<div class="cl-group-title">${g.group}</div>`
      + g.items.map((item,ii)=>`
        <div class="cl-item ${item.done?'done':''}" id="cli-${gi}-${ii}">
          <div class="cl-checkbox" onclick="toggleCheck(${gi},${ii})">${item.done?'✓':''}</div>
          <div class="cl-text" onclick="toggleCheck(${gi},${ii})">
            <div class="cl-main">${item.main}</div>
            ${item.sub?`<div class="cl-sub">${item.sub}</div>`:''}
          </div>
          ${item.custom?`<button class="cl-del" onclick="delCheck(${gi},${ii})">✕</button>`:''}
        </div>`).join('');
    c.appendChild(div);
  });
  updateProgress();
}
function toggleCheck(gi,ii){
  const done = checklist[gi].items[ii].done = !checklist[gi].items[ii].done;
  const el = document.getElementById(`cli-${gi}-${ii}`);
  el.classList.toggle('done',done);
  el.querySelector('.cl-checkbox').textContent = done?'✓':'';
  updateProgress();
}
function delCheck(gi,ii){ checklist[gi].items.splice(ii,1); buildChecklist(); }
function updateProgress(){
  const all = checklist.flatMap(g=>g.items);
  const done = all.filter(i=>i.done).length;
  document.getElementById('prog-fill').style.width = (done/all.length*100)+'%';
  document.getElementById('prog-txt').textContent = `${done} / ${all.length}`;
}
function toggleAddForm(){ document.getElementById('cl-add-form').classList.toggle('open'); document.getElementById('cl-form-main').focus(); }
function cancelAddForm(){ document.getElementById('cl-add-form').classList.remove('open'); document.getElementById('cl-form-main').value=''; document.getElementById('cl-form-sub').value=''; }
function confirmAdd(){
  const main = document.getElementById('cl-form-main').value.trim();
  if (!main){ document.getElementById('cl-form-main').focus(); return; }
  const sub = document.getElementById('cl-form-sub').value.trim();
  const grp = document.getElementById('cl-form-group').value;
  let target = checklist.find(g=>g.group===grp);
  if (!target){ checklist.push({group:grp,items:[]}); target=checklist[checklist.length-1]; }
  target.items.push({main,sub,done:false,custom:true});
  cancelAddForm(); buildChecklist();
}

// ══════════════ SHOPPING ══════════════
const CAT_COLOR = {'藥妝':'#4a90d9','零食':'#f5a623','伴手禮':'#4cb87a','衣物':'#e8445a','電子':'#8e44ad','其他':'#7f8c8d'};
function renderShop(){
  const c = document.getElementById('sh-list');
  if (!shopItems.length){ c.innerHTML='<div class="empty">尚未新增任何商品</div>'; return; }
  const groups = {};
  shopItems.forEach((item,i)=>{ (groups[item.cat]=groups[item.cat]||[]).push({...item,idx:i}); });
  c.innerHTML = Object.entries(groups).map(([cat,items])=>`
    <div class="sh-cat-section">
      <div class="sh-cat-label" style="color:${CAT_COLOR[cat]||'#888'}">${cat}</div>
      ${items.map(item=>`
        <div class="sh-item ${item.bought?'bought':''}" id="shi-${item.idx}">
          <div class="sh-item-row">
            <div class="sh-check" onclick="toggleShop(${item.idx})">${item.bought?'✓':''}</div>
            <div class="sh-name">${item.name}</div>
            <button class="sh-del" onclick="delShop(${item.idx})">✕</button>
          </div>
          <div class="sh-photos" id="shp-${item.idx}">
            ${(item.photos||[]).map(p=>`<img class="sh-photo" src="${p}" onclick="openLb('${p}')" alt="">`).join('')}
            <label class="sh-photo-add"><span class="ph-plus">📷</span><span>新增照片</span>
              <input class="ph-input" type="file" accept="image/*" onchange="addPhoto(event,${item.idx})">
            </label>
          </div>
        </div>`).join('')}
    </div>`).join('');
}
function addShop(){
  const name=document.getElementById('sh-input').value.trim();
  const cat=document.getElementById('sh-cat').value;
  if(!name) return;
  shopItems.push({name,cat,bought:false,photos:[],id:Date.now()});
  document.getElementById('sh-input').value='';
  renderShop();
}
function toggleShop(idx){ shopItems[idx].bought=!shopItems[idx].bought; renderShop(); }
function delShop(idx){ shopItems.splice(idx,1); renderShop(); }
function addPhoto(e,idx){
  const file=e.target.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=ev=>{ shopItems[idx].photos.push(ev.target.result); renderShop(); };
  reader.readAsDataURL(file);
}
function openLb(src){ document.getElementById('lb-img').src=src; document.getElementById('lightbox').classList.add('open'); }
function closeLb(){ document.getElementById('lightbox').classList.remove('open'); }
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeLb(); if(e.key==='Enter'&&document.activeElement.id==='sh-input') addShop(); });

// ══════════════ EXCHANGE ══════════════
async function fetchRate(){
  try{
    const r = await fetch('https://open.er-api.com/v6/latest/JPY');
    const data = await r.json();
    if(data.result==='success'){
      liveRate = data.rates['TWD'];
      const updated = new Date(data.time_last_update_utc).toLocaleDateString('zh-TW');
      document.getElementById('ex-badge').innerHTML = `<span class="ex-rate-live">● 即時匯率</span>　¥1 = NT$ ${liveRate.toFixed(4)}　更新：${updated}`;
      calcEx();
    }
  }catch(e){
    liveRate=0.215;
    document.getElementById('ex-badge').textContent='⚠️ 無法取得即時匯率，使用參考值 ¥1 ≈ NT$0.215';
    calcEx();
  }
}
function setExDir(from,to,el){
  exDir={from,to};
  document.querySelectorAll('.ex-tab').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('ex-lbl').textContent = from==='JPY'?'輸入日圓 (¥)':'輸入台幣 (NT$)';
  calcEx();
}
function calcEx(){
  if(!liveRate) return;
  const val=parseFloat(document.getElementById('ex-inp').value)||0;
  let result,sym,symF;
  if(exDir.from==='JPY'){ result=val*liveRate; sym='NT$'; symF='¥'; }
  else{ result=val/liveRate; sym='¥'; symF='NT$'; }
  document.getElementById('ex-num').textContent=`${sym} ${result.toLocaleString('zh-TW',{maximumFractionDigits:0})}`;
  document.getElementById('ex-sub').textContent=`${symF}${val.toLocaleString()} → ${sym}${result.toLocaleString('zh-TW',{maximumFractionDigits:0})}`;
}

// ══════════════ LEDGER ══════════════
function addLedger(){
  const payer=document.getElementById('ld-payer').value;
  const date=document.getElementById('ld-date').value;
  const item=document.getElementById('ld-item').value.trim();
  const amount=parseFloat(document.getElementById('ld-amount').value)||0;
  const currency=document.getElementById('ld-currency').value;
  if(!item||!amount) return;
  ledgerItems.push({payer,date,item,amount,currency,id:Date.now()});
  document.getElementById('ld-item').value='';
  document.getElementById('ld-amount').value='';
  renderLedger();
}
function delLedger(id){ ledgerItems=ledgerItems.filter(l=>l.id!==id); renderLedger(); }
function toJPY(l){ return l.currency==='JPY'?l.amount:l.amount/(liveRate||0.215); }
function renderLedger(){
  const c=document.getElementById('ld-list');
  if(!ledgerItems.length){ c.innerHTML='<div class="empty">尚未記帳</div>'; document.getElementById('ld-summary').style.display='none'; return; }
  const order=['5/23','5/24','5/25','5/26','5/27','5/28','5/29','5/30'];
  const sorted=[...ledgerItems].sort((a,b)=>order.indexOf(a.date)-order.indexOf(b.date));
  c.innerHTML=sorted.map(l=>`
    <div class="ld-row">
      <div class="ld-avatar ${l.payer==='奕銓'?'ld-yq':'ld-bf'}">${l.payer==='奕銓'?'奕':'秉'}</div>
      <div class="ld-info">
        <div class="ld-item-name">${l.item}</div>
        <div class="ld-item-sub">${l.date} · ${l.payer}</div>
      </div>
      <div class="ld-amt">${l.currency==='JPY'?'¥':'NT$'}${l.amount.toLocaleString()}</div>
      <button class="ld-del" onclick="delLedger(${l.id})">✕</button>
    </div>`).join('');
  const sYQ=ledgerItems.filter(l=>l.payer==='奕銓').reduce((s,l)=>s+toJPY(l),0);
  const sBF=ledgerItems.filter(l=>l.payer==='秉芬').reduce((s,l)=>s+toJPY(l),0);
  const total=sYQ+sBF;
  const diff=sYQ-sBF;
  let settle=Math.abs(diff)<1?'✓ 雙方花費均等':diff>0?`秉芬 需給奕銓 ¥${Math.round(diff/2).toLocaleString()}`:`奕銓 需給秉芬 ¥${Math.round(-diff/2).toLocaleString()}`;
  document.getElementById('sum-yq').textContent=`¥${Math.round(sYQ).toLocaleString()}`;
  document.getElementById('sum-bf').textContent=`¥${Math.round(sBF).toLocaleString()}`;
  document.getElementById('sum-total').textContent=`¥${Math.round(total).toLocaleString()}`;
  document.getElementById('ld-settle').textContent=settle;
  document.getElementById('ld-summary').style.display='block';
}

// ══════════════ TAB ══════════════
function switchTab(name, btn){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('page-'+name).classList.add('active');
  btn.classList.add('active');
  // Header: hide on itinerary (hero takes over), show on others
  document.getElementById('app-header').style.display = name==='itinerary'?'none':'flex';
}
